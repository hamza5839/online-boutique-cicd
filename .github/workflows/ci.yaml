name: CI learnings
on:
  push:
    branches:
      - main
  workflow_dispatch:
env:
  APP_NAME: frontend
jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Show run information
        env:
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "Repository: $REPOSITORY"
          echo "Branch: $BRANCH"
          echo "Commit: $COMMIT"
          echo "Event: $EVENT"

  build:
    needs: check
    runs-on: ubuntu-latest

    steps:
      - name: Read workflow variable again
        run: echo "Building $APP_NAME"

  