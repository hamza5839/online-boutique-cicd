name: CI Basics First

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  Nello:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v6

      - name: Inspect frontend
        working-directory: app/frontend
        run: |
          pwd
          ls -la

      - name: Inspect repository root
        run: pwd

      - name: Practice a failure
        run: |
          echo "This step will fail intentionally"
          exit 1

      - name: Report failure
        if: failure()
        run: echo "An earlier step failed"

      - name: Next normal step
        run: echo "You will not see this message"
        
      - name: Final report
        if: always()
        run: echo "This runs after success or failure"