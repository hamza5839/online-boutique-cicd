name: CI Basics First

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Practice a check
        run: echo "Checks passed"

  build:
    needs: check
    runs-on: ubuntu-latest

    steps:
      - name: Practice a build
        run: echo "Building after checks passed"