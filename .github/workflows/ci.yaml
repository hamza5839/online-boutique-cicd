name: CI learnings
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
env:
  APP_NAME: frontend
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download repository
        uses: actions/checkout@v6

      - name: Install YAML checker
        run: |
          sudo apt-get update
          sudo apt-get install -y yamllint

      - name: Validate YAML files
        run: yamllint -d relaxed k8s/ argocd/ .github/workflows/
      - name: Validate development overlay
        run: |
          kubectl version --client
          kubectl kustomize k8s/overlays/dev > /tmp/boutique-dev.yaml
          test -s /tmp/boutique-dev.yaml
      - name: Upload rendered development manifests
        uses: actions/upload-artifact@v7
        with:
          name: boutique-dev-manifests
          path: /tmp/boutique-dev.yaml
          if-no-files-found: error
          retention-days: 7

      - name: Check required frontend files
        working-directory: app/frontend
        run: |
          test -f Dockerfile
          test -f go.mod
          test -f go.sum
          echo "All required files exist"

      - name: Check Dockerfile has a builder stage
        working-directory: app/frontend
        run: |
          grep -q 'AS builder' Dockerfile
          echo "Builder stage found"

      - name: Build testing image
        run: docker build --target builder -t frontend:test app/frontend

      - name: Run Go tests and save report
        shell: bash
        run: docker run --rm frontend:test go test -v ./... 2>&1 | tee test-report.txt

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-test-report
          path: test-report.txt
          retention-days: 7

  build:
    needs: check
    uses: ./.github/workflows/build-image.yaml
    with:
      context: app/frontend
      service: frontend

  publish:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      packages: write

    env:
      IMAGE_NAME: ${{ vars.IMAGE_NAME }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Download repository
        uses: actions/checkout@v6

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build and publish image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app/frontend
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

