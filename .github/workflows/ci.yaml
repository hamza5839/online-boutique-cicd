name: CI learnings
on:
  push:
    branches:
      - main
  workflow_dispatch:
env:
  APP_NAME: frontend
jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v6

      - name: Check required frontend files
        working-directory: app/frontend
        run: |
          test -f Dockerfile
          test -f go.mod
          test -f go.sum
          echo "All required files exist"

      - name: Check Dockerfile has a builder stage
        working-directory: app/frontend
        run: |
          grep -q 'AS builder' Dockerfile
          echo "Builder stage found"

      - name: Build testing image
        run: docker build --target builder -t frontend:test app/frontend

      - name: Run Go tests
        run: docker run --rm frontend:test go test -v ./...

   build:
    needs: check
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v6

      - name: Build application image
        run: docker build -t frontend:v1 app/frontend

      - name: Verify image exists
        run: docker image inspect frontend:v1
        