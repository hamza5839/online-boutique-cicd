name: CI learnings
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
env:
  APP_NAME: frontend
jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v6

      - name: Check required frontend files
        working-directory: app/frontend
        run: |
          test -f Dockerfile
          test -f go.mod
          test -f go.sum
          echo "All required files exist"

      - name: Check Dockerfile has a builder stage
        working-directory: app/frontend
        run: |
          grep -q 'AS builder' Dockerfile
          echo "Builder stage found"

      - name: Build testing image
        run: docker build --target builder -t frontend:test app/frontend

      - name: Run Go tests and save report
        shell: bash
        run: docker run --rm frontend:test go test -v ./... 2>&1 | tee test-report.txt

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-test-report
          path: test-report.txt
          retention-days: 7

  build:
    needs: check

    if: github.event_name != 'pull_request'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/hamza5839/online-boutique-cicd
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Download repository
        uses: actions/checkout@v6

      - name: Log in to GHCR
        env:

          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and publish with cache
        uses: docker/build-push-action@v7
        with:
          context: app/frontend
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
