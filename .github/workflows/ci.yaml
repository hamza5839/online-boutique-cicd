name: CI learnings
on:
  push:
    branches:
      - main
  workflow_dispatch:
env:
  APP_NAME: frontend
jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Show latest commit
        run: git log -1 --oneline

  build:
    needs: check
    runs-on: ubuntu-latest

    steps:
      - name: Read workflow variable again
        run: echo "Building $APP_NAME"

  